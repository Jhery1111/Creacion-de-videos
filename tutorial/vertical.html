<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Guía rápida vertical</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* Formato vertical 9:16 (TikTok / Reels). Zonas: encabezado 120-250,
     contenido 290-1460, subtitulos encima de la franja inferior de la app. */
  :root { --W: 1080px; --H: 1920px; }
  #subs { bottom: 330px; }
  #subs .box { max-width: 960px; font: 700 40px/1.3 'Inter'; padding: 16px 30px 18px; }
  .hdr { left: 40px; top: 120px; }
  .hdr .num { width: 98px; height: 98px; font-size: 50px; }
  .hdr .kick { font-size: 19px; }
  .hdr .ttl { font-size: 42px; }
  .brand { right: 40px; top: 36px; width: 150px; height: 74px; }
  .wipe.b .mark { width: 340px; height: 180px; }
  .vcard { position: absolute; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(48,60,46,.16); border: 1px solid rgba(70,86,56,.14); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="build/timeline_v.js"></script>
<script src="core.js"></script>
<script src="vertical.js"></script>
</body>
</html>
